<script>
  /* ?f=N -> one static frame (360x800 review captures). v6 numbering: f0 WhatsApp (the share card + message) · f1 landing P1 hero incl. the inviter pop-up (&s=0 = no sender; &t=0 = the sender toast already closed; &me=1 = the RETURNING view "आपका दीया") · f2 landing P2 leaderboard (cities + "एक दीया, कई दीये") · f3 landing P3 video · f4 light (&e=1 = mantra playing) · f5 Q1 cause (&x=1 = list expanded) · f6 Q2 message · f7 Q3 name + city + photo (&c=1 = city chosen, &c=2 = "बाद में", &ph=1|2 = mock photo) · f8 rangoli · f9 final · f10 share sheet with the WhatsApp-updates box (&v=1 = वीडियो + optional section open) · f11 final + the post-share "अपडेट चालू करें" card · f12 live tracker · f13 = f1&me=1. Add &full=1 to f1 for the whole landing as one tall capture; &from=&to=&p=&r=&d= personalise; no param -> the real interactive page + flow. */
  var q = new URLSearchParams(location.search), f = q.get('f'), de = document.documentElement;
  if (q.get('fs')) de.style.fontSize = (parseFloat(q.get('fs')) * 100) + '%';   /* review only: &fs=1.3 = Android "font size: large" */
  /* big system fonts (Android "font size: large"): .bigtext lets the pixel-placed screens (final) relax into a compact layout */
  (function () { function bt() { de.classList.toggle('bigtext', parseFloat(getComputedStyle(de).fontSize) >= 18.5); } bt(); addEventListener('resize', bt); })();
  if (f === '8') f = '9';   /* D-074: the rangoli screen is gone from the flow; ?f=8 now shows the final screen */
  if (f) { de.dataset.solo = f; var qm = { '5': '1', '6': '2', '7': '3' }; if (qm[f]) de.dataset.q = qm[f]; if (q.get('x')) de.dataset.x = q.get('x'); if (q.get('e')) de.dataset.e = q.get('e'); if (q.get('v')) de.dataset.v = q.get('v'); if (q.get('full')) de.dataset.full = '1'; } else de.classList.add('live');
</script>

<style>
/* =====================================================================
   Daily Bhakti — db.css  (design tokens + component library)
   Single source of truth. Mirrors the Figma file "Daily-bhakti-app-components"
   (Beyond UI v2.0 A, "daily bhakti" mode + Daily Bhakti / Semantic).
   Fonts: Noto Sans Devanagari (UI, Indic), Inter (Latin/numbers),
          Yatra One (display / devotional, art only),
          Iconoir (all system icons — the Beyond UI icon set used in Figma and the app;
          load https://cdn.jsdelivr.net/npm/iconoir@7.10.1/css/iconoir.css).
   v2.0: aligned to Figma DB library + shipped app (design-system/drift.md).
   Every class is prefixed db- ; tokens are --db-* custom properties.
   ===================================================================== */

/* ---------- 1. Tokens ---------- */
:root {
  /* Primary — saffron */
  --db-primary-50:  #FFF7ED;
  --db-primary-100: #FFEDD5;
  --db-primary-200: #FED7AA;
  --db-primary-300: #FDBA74;
  --db-primary-400: #FB923C;  /* legacy only — do not use for actions */
  --db-primary-500: #F97316;  /* THE brand orange: every action */
  --db-primary-600: #EA580C;  /* pressed, orange text on white, logo ink */
  --db-primary-700: #C2410C;  /* small orange text, headings on cream */
  --db-primary-800: #9A3412;
  --db-primary-900: #7C2D12;

  /* Base — neutrals */
  --db-base-0:   #FFFFFF;
  --db-base-50:  #F9FAFB;
  --db-base-100: #F2F4F7;
  --db-base-200: #E4E7EC;
  --db-base-300: #CED2DA;
  --db-base-400: #97A1AF;
  --db-base-500: #637083;
  --db-base-700: #344051;
  --db-base-750: #27313F;
  --db-base-900: #141C25;
  --db-base-950: #0B0F14;

  /* Status + accents */
  --db-green-50:  #F0FDF4; --db-green-100: #DCFCE7; --db-green-200: #BBF7D0;
  --db-green-500: #22C55E; --db-green-600: #16A34A; --db-green-700: #15803D;
  --db-error-50:  #FFE5E5; --db-error-100: #FFC2C2; --db-error-200: #FFA3A3;
  --db-error-500: #FF4D4D; --db-error-600: #F62C2C; --db-error-700: #DE1212;
  --db-amber-50: #FFFBEB; --db-amber-100: #FEF3C7; --db-amber-200: #FDE68A; --db-amber-300: #FCD34D;
  --db-amber-400: #FBBF24; --db-amber-500: #F59E0B; --db-amber-600: #D97706;
  --db-amber-700: #B45309; --db-amber-800: #92400E;
  --db-yellow-50: #FEFCE8; --db-yellow-100: #FEF9C3; --db-yellow-200: #FEF08A; --db-yellow-300: #FDE047;
  --db-info-500:  #0BA5EC;

  /* Semantic roles */
  --db-text-primary:   var(--db-base-900);
  --db-text-secondary: var(--db-base-700);
  --db-text-tertiary:  var(--db-base-500);
  --db-text-disabled:  var(--db-base-400);
  --db-text-on-brand:  var(--db-base-0);
  --db-border:         var(--db-base-200);
  --db-border-strong:  var(--db-base-300);
  --db-bg-surface:     var(--db-base-0);
  --db-bg-muted:       var(--db-base-100);
  --db-bg-surface-warm: var(--db-primary-100);
  --db-bg-primary-a10: rgb(249 115 22 / .10);
  --db-bg-screen: linear-gradient(180deg, var(--db-primary-100) 0%, var(--db-base-0) 100%); /* Gradients/Screen = shipped app */
  --db-bg-chat: var(--db-base-50);

  /* Ritual (immersive dark) */
  --db-ritual-bg:     var(--db-base-950);
  --db-ritual-text:   var(--db-primary-50);
  --db-ritual-accent: var(--db-amber-400);
  --db-ritual-cta-bg: var(--db-amber-100);
  --db-ritual-cta-fg: var(--db-primary-800);
  /* Jap (utility dark) */
  --db-jap-surface: var(--db-base-900);
  --db-jap-pill:    var(--db-base-750);

  /* Overlays + gradients */
  --db-overlay: 0 0 0;            /* use as rgb(var(--db-overlay) / .4) */
  --db-scrim-40: rgb(0 0 0 / .40);
  --db-scrim-60: rgb(0 0 0 / .60);
  --db-grad-image-scrim: linear-gradient(0deg, rgb(0 0 0 / .70) 0%, rgb(0 0 0 / 0) 100%);
  --db-grad-gold: linear-gradient(180deg, var(--db-amber-600), var(--db-amber-700));
  --db-grad-soft-gold: linear-gradient(180deg, var(--db-amber-200), var(--db-amber-300));
  --db-grad-warm-card: linear-gradient(180deg, var(--db-primary-50), var(--db-primary-100));
  --db-grad-logo: linear-gradient(180deg, #FFF7ED, #FFE5C2);

  /* Spacing — 4-pt grid */
  --db-space-1: 4px;  --db-space-2: 8px;  --db-space-3: 12px; --db-space-4: 16px;
  --db-space-5: 20px; --db-space-6: 24px; --db-space-8: 32px;
  --db-gutter: 16px;            /* screen side margin (phone) */

  /* Radius */
  --db-radius-s: 8px; --db-radius-m: 10px; --db-radius-l: 12px;
  --db-radius-xl: 16px; --db-radius-xxl: 20px; --db-radius-max: 999px;

  /* Elevation (mostly flat) */
  --db-shadow-xs: 0 1px 2px rgb(20 28 37 / .05);
  --db-shadow-s:  0 4px 6px -1px rgb(20 28 37 / .07), 0 2px 4px -2px rgb(20 28 37 / .05);
  --db-shadow-xl: 0 20px 25px -5px rgb(20 28 37 / .10), 0 8px 10px -6px rgb(20 28 37 / .10);

  /* Type */
  --db-font-ui: "Noto Sans Devanagari", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --db-font-latin: "Inter", "Noto Sans Devanagari", system-ui, sans-serif;
  --db-font-display: "Yatra One", "Noto Sans Devanagari", serif;
  /* Icons: Iconoir CSS (mask icons, 1.5px stroke) — no icon font variable needed */

  /* Motion */
  --db-ease: cubic-bezier(.2, .7, .2, 1);
  --db-dur-fast: 120ms; --db-dur: 220ms;
}

/* ---------- 2. Base ---------- */
.db, .db * { box-sizing: border-box; }
.db { font-family: var(--db-font-ui); color: var(--db-text-primary); -webkit-font-smoothing: antialiased; }
.db-screen { background: var(--db-bg-screen); }
.db-ritual { background: var(--db-ritual-bg); color: var(--db-ritual-text); }
.db-jap { background: var(--db-jap-surface); color: var(--db-base-0); }

/* Type scale (Devanagari line heights; Latin can use the tighter value) */
.db-h5       { font: 600 28px/40px var(--db-font-ui); }
.db-h6       { font: 600 24px/36px var(--db-font-ui); }
.db-subtitle { font: 600 20px/32px var(--db-font-ui); }
.db-p-l      { font: 400 18px/28px var(--db-font-ui); }
.db-p-m      { font: 400 16px/26px var(--db-font-ui); }
.db-p-s      { font: 400 14px/22px var(--db-font-ui); }
.db-caption  { font: 400 12px/18px var(--db-font-ui); }
.db-semibold { font-weight: 600; } .db-medium { font-weight: 500; } .db-bold { font-weight: 700; }
.db-display  { font-family: var(--db-font-display); font-weight: 400; letter-spacing: 0; }
.db-num      { font-family: var(--db-font-latin); font-variant-numeric: tabular-nums; }
.db-t2 { color: var(--db-text-secondary); } .db-t3 { color: var(--db-text-tertiary); } .db-tbrand { color: var(--db-primary-600); }
.db-clamp-1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.db-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Icons: Iconoir (iconoir.com — the Beyond UI set used in Figma + app), 24px, 1.5px round stroke, outline.
   <i class="db-icon iconoir-home-simple-door" aria-hidden="true"></i>   (needs iconoir.css, see header)
   Filled (active tab, liked, bookmarked): use the "-solid" name, e.g. iconoir-heart-solid. Colour = currentColor.
   SVG brand marks (WhatsApp, ॐ) use svg.db-icon from icons.svg. */
.db-icon { display: inline-block; flex: none; font-size: 24px; width: 1em; height: 1em; line-height: 1; color: inherit; font-style: normal; }
.db-icon::before { width: 1em !important; height: 1em !important; }
.db-icon--20 { font-size: 20px; }
.db-icon--16 { font-size: 16px; }
.db-icon--18 { font-size: 18px; }
svg.db-icon. */
.db-icon { font-family: var(--db-font-icon); font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; width: 1em; height: 1em; flex: none; overflow: hidden; white-space: nowrap; direction: ltr; user-select: none;
  -webkit-font-smoothing: antialiased; font-feature-settings: "liga"; -webkit-font-feature-settings: "liga";
  font-variation-settings: "FILL" 0, "wght" var(--db-icon-weight), "GRAD" 0, "opsz" 24; }
.db-icon--20 { font-size: 20px; font-variation-settings: "FILL" 0, "wght" var(--db-icon-weight), "GRAD" 0, "opsz" 20; }
.db-icon--16 { font-size: 16px; font-variation-settings: "FILL" 0, "wght" var(--db-icon-weight), "GRAD" 0, "opsz" 20; }
.db-icon--fill { font-variation-settings: "FILL" 1, "wght" var(--db-icon-weight), "GRAD" 0, "opsz" 24; }
svg.db-icon { width: 24px; height: 24px; font-size: inherit; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
svg.db-icon--20 { width: 20px; height: 20px; } svg.db-icon--16 { width: 16px; height: 16px; }

/* Focus */
.db :is(button, a, input, textarea, [tabindex]):focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }

/* ---------- 3. Actions ---------- */
.db-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 var(--db-space-5); border-radius: var(--db-radius-l); /* Large = r12 (DB / Button, AppCommonButton) */
  border: 1px solid transparent; font: 600 16px/26px var(--db-font-ui); cursor: pointer;
  transition: background var(--db-dur-fast) var(--db-ease), transform var(--db-dur-fast) var(--db-ease);
  background: var(--db-primary-500); color: var(--db-text-on-brand); white-space: nowrap; text-decoration: none;
}
.db-btn:hover { background: var(--db-primary-600); }
.db-btn:active, .db-btn.is-pressed { background: var(--db-primary-600); transform: scale(.98); }
.db-btn--block { width: 100%; }
.db-btn--sm { height: 32px; padding: 0 var(--db-space-4); border-radius: var(--db-radius-max); font: 600 14px/22px var(--db-font-ui); } /* Small = pill */
.db-btn--outline { background: var(--db-base-0); color: var(--db-text-secondary); border-color: var(--db-border-strong); }
.db-btn--outline:hover, .db-btn--outline.is-pressed { background: var(--db-base-100); }
.db-btn--ritual { background: var(--db-ritual-cta-bg); color: var(--db-ritual-cta-fg); }
.db-btn--ritual:hover, .db-btn--ritual.is-pressed { background: var(--db-amber-200); }
.db-btn--text { background: transparent; color: var(--db-primary-600); }
.db-btn--text:hover, .db-btn--text.is-pressed { background: var(--db-bg-primary-a10); }
.db-btn:disabled, .db-btn.is-disabled { background: var(--db-base-100); color: var(--db-text-disabled); border-color: transparent; cursor: not-allowed; transform: none; }
.db-btn.is-loading { color: transparent; position: relative; pointer-events: none; }
.db-btn.is-loading::after { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .45); border-top-color: #fff; animation: db-spin .8s linear infinite; }

.db-icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--db-radius-max); border: 0; background: transparent; color: var(--db-text-primary); cursor: pointer; }
.db-icon-btn--filled { background: var(--db-base-100); }
.db-icon-btn--sm { width: 32px; height: 32px; }

/* Cream pill CTA on ritual screens */
.db-ritual-cta { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; width: 100%; border: 0; border-radius: var(--db-radius-max); background: var(--db-ritual-text); color: var(--db-ritual-bg); font: 600 16px/26px var(--db-font-ui); cursor: pointer; }
.db-ritual-cta.is-done { opacity: .6; }

.db-link { color: var(--db-primary-600); font-weight: 600; text-decoration: none; }

/* Like / save */
.db-like { display: inline-flex; align-items: center; gap: 4px; color: var(--db-text-secondary); background: none; border: 0; font: 500 14px/22px var(--db-font-ui); cursor: pointer; }
.db-like.is-on { color: var(--db-error-600); }
.db-like.is-on .db-icon { font-variation-settings: "FILL" 1, "wght" var(--db-icon-weight), "GRAD" 0, "opsz" 20; }

/* ---------- 4. Forms ---------- */
.db-field { display: grid; gap: 4px; }
.db-label { font: 500 12px/18px var(--db-font-ui); color: var(--db-text-secondary); }
.db-input {
  width: 100%; height: 48px; padding: 0 var(--db-space-4); border-radius: var(--db-radius-l);
  border: 1px solid var(--db-border-strong); background: var(--db-base-0);
  font: 400 16px/26px var(--db-font-ui); color: var(--db-text-primary); outline: none;
}
.db-input::placeholder { color: var(--db-text-disabled); }
.db-input:focus, .db-input.is-focus { border-color: var(--db-primary-500); box-shadow: 0 0 0 3px var(--db-bg-primary-a10); }
.db-input.is-error { border-color: var(--db-error-500); }
.db-input:disabled { background: var(--db-base-100); color: var(--db-text-disabled); }
textarea.db-input { height: auto; min-height: 96px; padding: 12px 16px; resize: vertical; }
.db-helper { font: 400 12px/18px var(--db-font-ui); color: var(--db-text-tertiary); }
.db-helper.is-error { color: var(--db-error-600); }
.db-phone { display: flex; align-items: center; gap: 8px; }
.db-phone__cc { flex: none; width: 64px; text-align: center; }

.db-search { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border-radius: var(--db-radius-max); background: var(--db-base-0); box-shadow: var(--db-shadow-xs); border: 0; color: var(--db-text-tertiary); }
.db-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 400 14px/22px var(--db-font-ui); color: var(--db-text-primary); }
.db-search input::placeholder { color: var(--db-text-disabled); }

.db-otp { display: flex; gap: 12px; }
.db-otp__box { width: 72px; height: 56px; border-radius: var(--db-radius-l); border: 1px solid var(--db-border-strong); display: grid; place-items: center; font: 600 20px/1 var(--db-font-latin); background: var(--db-base-0); }
.db-otp__box.is-active { border-color: var(--db-primary-500); box-shadow: 0 0 0 3px var(--db-bg-primary-a10); }

.db-chip { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 16px; border-radius: var(--db-radius-max); border: 1px solid var(--db-border-strong); background: var(--db-base-0); color: var(--db-text-secondary); font: 500 14px/22px var(--db-font-ui); cursor: pointer; white-space: nowrap; }
.db-chip.is-selected { background: var(--db-primary-500); border-color: var(--db-primary-500); color: #fff; font-weight: 600; }
.db-chip--option.is-selected { background: var(--db-primary-50); border: 1.5px solid var(--db-primary-500); color: var(--db-primary-700); }
.db-chip--avatar { padding-left: 4px; }
.db-chip__avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--db-primary-100); object-fit: cover; }
.db-chip-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }

.db-check { display: inline-flex; align-items: center; gap: 8px; font: 400 14px/22px var(--db-font-ui); cursor: pointer; }
.db-check input { appearance: none; width: 20px; height: 20px; margin: 0; border-radius: 6px; border: 1.5px solid var(--db-border-strong); background: var(--db-base-0); display: grid; place-items: center; }
.db-check input:checked { background: var(--db-primary-500); border-color: var(--db-primary-500); }
.db-check input:checked::after { content: ""; width: 10px; height: 6px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

.db-toggle { appearance: none; width: 44px; height: 24px; border-radius: 999px; background: var(--db-base-300); position: relative; cursor: pointer; transition: background var(--db-dur) var(--db-ease); margin: 0; }
.db-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--db-shadow-xs); transition: transform var(--db-dur) var(--db-ease); }
.db-toggle:checked { background: var(--db-primary-500); }
.db-toggle:checked::after { transform: translateX(20px); }

.db-select { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; border-radius: var(--db-radius-l); border: 1px solid var(--db-border-strong); background: var(--db-base-0); font: 600 14px/22px var(--db-font-ui); }
.db-select.is-open { border: 1.5px solid var(--db-primary-500); }
.db-menu { margin-top: 4px; border-radius: var(--db-radius-l); border: 1px solid var(--db-border); background: var(--db-base-0); padding: 4px 0; box-shadow: var(--db-shadow-s); }
.db-menu__item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font: 400 14px/22px var(--db-font-ui); }
.db-menu__item.is-selected { background: var(--db-primary-50); color: var(--db-primary-700); font-weight: 600; }

/* ---------- 5. Lists & rows ---------- */
.db-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; }
.db-row__body { flex: 1; min-width: 0; }
.db-row__title { font: 600 14px/22px var(--db-font-ui); }
.db-row__meta  { font: 400 12px/18px var(--db-font-ui); color: var(--db-text-tertiary); }
.db-thumb { width: 48px; height: 48px; flex: none; border-radius: var(--db-radius-s); background: var(--db-primary-100); object-fit: cover; }
.db-row.is-playing .db-row__title, .db-row.is-playing .db-row__meta { color: var(--db-primary-600); }
.db-eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.db-eq i { width: 3px; background: var(--db-primary-500); border-radius: 2px; animation: db-eq 1s ease-in-out infinite; }
.db-eq i:nth-child(2) { animation-delay: -.3s; } .db-eq i:nth-child(3) { animation-delay: -.6s; }

.db-select-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px; border-radius: var(--db-radius-l); border: 1px solid var(--db-border); background: var(--db-base-0); font: 600 16px/26px var(--db-font-ui); cursor: pointer; }
.db-select-row.is-selected { background: var(--db-primary-100); border-color: var(--db-primary-300); }
.db-select-row .db-check-mark { margin-left: auto; color: var(--db-primary-600); visibility: hidden; }
.db-select-row.is-selected .db-check-mark { visibility: visible; }

  /* ===== Icons: inline SVG (Material Symbols Rounded, wght 300, 24px) - no font, no ligature flash ===== */
  .ic { width: 24px; height: 24px; flex: none; display: block; fill: currentColor; }

  .ic--16 { width: 16px; height: 16px; }

  /* ===== Shared ritual glue ===== */
  .bgm { position: absolute; inset: 0; overflow: hidden; background: var(--db-ritual-bg); }

  .bgm video { opacity: 0; transition: opacity .6s ease; }
  .bgm video.on { opacity: 1; }
  .rit__top-scrim { position: absolute; inset: 0 0 auto; height: 150px; background: linear-gradient(180deg, var(--db-scrim-60), transparent); pointer-events: none; }
  .rit__scrim { position: absolute; inset: auto 0 0; height: 62%; background: var(--db-grad-image-scrim); pointer-events: none; }
  .rit__scrim::after { content: ""; position: absolute; inset: auto 0 0; height: 55%; background: linear-gradient(0deg, var(--db-ritual-bg), transparent); }
  .rit__head { position: absolute; inset: 0 0 auto; padding: 16px 16px 0; display: grid; gap: 12px; z-index: 5; }

  .closebtn { width: 40px; height: 40px; border-radius: 50%; border: 0; display: inline-grid; place-items: center; background: rgb(11 15 20 / .55); color: var(--db-ritual-text); cursor: pointer; flex: none; padding: 0; }
  .closebtn:focus-visible, .altar__target:focus-visible, .db-ritual-cta:focus-visible, .db-btn:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .tools { display: inline-flex; align-items: center; gap: 8px; }
  /* ===== 00 WhatsApp (palette scoped to this frame) ===== */
  .wa { background: #EFEAE2; display: flex; flex-direction: column; font-family: var(--db-font-ui); }

  .wa__date { justify-self: center; background: #fff; color: #54656F; font: 500 0.75rem/1.125rem var(--db-font-ui); padding: 4px 12px; border-radius: 8px; }
  .wa__bubble { position: relative; width: 304px; max-width: 100%; background: #fff; color: #111B21; border-radius: 0 8px 8px 8px; padding: 4px; display: grid; gap: 4px; }
  .wa__prev { background: #F5F6F6; border-radius: 6px; overflow: hidden; }
  .wa__thumb { position: relative; width: 100%; height: 166px; overflow: hidden; background: #1c140d; }
  .wa__thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; max-width: none; }
  .wa__thumb::after { content: ""; position: absolute; inset: auto 0 0; height: 64px; background: var(--db-grad-image-scrim); }
  .wa__thumb b { position: absolute; left: 12px; right: 12px; bottom: 8px; z-index: 1; color: var(--db-ritual-text); font: 800 1.25rem/2rem 'Martel', var(--db-font-ui); }
  .wa__ptxt { padding: 8px 10px 10px; display: grid; gap: 2px; }
  .wa__ptitle { font: 600 0.875rem/1.375rem var(--db-font-ui); color: #111B21; margin: 0; }
  .wa__pdom { font: 400 0.75rem/1.125rem var(--db-font-ui); color: #667781; margin: 0; }
  .wa__msg { margin: 0; padding: 2px 6px 0; font: 400 0.9375rem/1.5rem var(--db-font-ui); }
  .wa__link { margin: 0; padding: 0 6px; font: 400 0.9375rem/1.5rem var(--db-font-latin); color: #027EB5; }
  .wa__time { justify-self: end; padding: 0 6px 2px; font: 400 0.6875rem/1rem var(--db-font-latin); color: #667781; }

  /* ===== v5 top bar (D-042): the SAME bar on every view - "Light a Diya" (Yatra One) left; "लाइव" pill + sound right ===== */
  .tbar { position: absolute; z-index: 40; inset: 0 0 auto; height: 56px; box-sizing: border-box; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none; }
  .tbar > * { pointer-events: auto; }
  .tbar::before { content: ""; position: absolute; z-index: -1; inset: 0 0 -14px; background: linear-gradient(180deg, rgb(11 15 20 / .84), rgb(11 15 20 / 0)); pointer-events: none; transition: background .25s ease; }
  .tbar.stuck::before { inset: 0; background: rgb(11 15 20 / .92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 1px 0 rgb(255 247 237 / .1); }
  .tb__l { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tb__brand { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .tb__mark { flex: none; width: 32px; height: 32px; border-radius: 50%; filter: drop-shadow(0 2px 6px rgb(251 146 60 / .35)); }
  @media (max-width: 340px) { .tb__mark { width: 28px; height: 28px; } }
  /* D-046: no Daily Bhakti branding - the bar carries only "Light a Diya" in the DB display font (Yatra One) */
  .tb__t { font: 400 1.375rem/1.75rem var(--db-font-display); color: var(--db-ritual-text); white-space: nowrap; text-shadow: 0 1px 8px rgb(0 0 0 / .6); }
  /* D-090 landing sign-off: mark + wordmark above the title (the tagline is the h1 right below, so it is not repeated); the header wordmark waits until the bar is stuck */
  .lockup { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 6px; }
  .lockup__mark { flex: none; width: 48px; height: 48px; border-radius: 50%; background: url("images/logo/mark.webp") 50% 50% / cover no-repeat; filter: drop-shadow(0 2px 8px rgb(251 146 60 / .4)); }
  .lockup__t { font: 400 1.5rem/2rem var(--db-font-display); color: var(--db-ritual-text); text-shadow: 0 1px 10px rgb(0 0 0 / .7); white-space: nowrap; }
  @media (max-width: 340px) { .tbar { padding-left: 6px; padding-right: 6px; } .tbar .tb__mark { width: 26px; height: 26px; } .tbar .tb__brand { gap: 6px; } .tbar .tb__l { gap: 2px; } .tbar .tb__t { font-size: 0.875rem; } .livepill { padding: 0 10px 0 8px; gap: 5px; } }
  @media (max-height: 700px) { .lockup__mark { width: 40px; height: 40px; } .lockup__t { font-size: 1.25rem; } }
  .tb__r { display: flex; align-items: center; gap: 8px; flex: none; }
  .livepill { flex: none; height: 40px; padding: 0 14px 0 12px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgb(255 247 237 / .32); border-radius: var(--db-radius-max); background: rgb(11 15 20 / .55); color: var(--db-ritual-text); font: 600 0.875rem/1.375rem var(--db-font-ui); cursor: pointer; }
  .livepill:focus-visible, .ctab:focus-visible, .vid__play:focus-visible, .hcue:focus-visible, .tz__cta:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .livepill[aria-current="true"] { border-color: var(--db-amber-400); }
  .ldot { position: relative; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--db-error-500); background: color-mix(in srgb, var(--db-error-500) 55%, var(--db-primary-500)); }
  .ldot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ldot 1.6s ease-out infinite; }
  @keyframes ldot { 0% { transform: scale(1); opacity: .75; } 100% { transform: scale(2.8); opacity: 0; } }
  /* r14: the title never hides (it shrinks, then truncates) */

  /* ===== 01 Landing (D-042): a scrollable page on the dark ritual theme ===== */
  .land { background: var(--db-ritual-bg); }
  .land__sc { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }

  .num { font-family: var(--db-font-latin); font-variant-numeric: tabular-nums; }
  /* 1 hero: ~100dvh */
  .hero__bg { position: absolute; z-index: -1; inset: 0; background: url("images/hero-unlit.jpg") 50% 0 / cover no-repeat; opacity: .3; -webkit-mask-image: linear-gradient(180deg, #000 0, #000 12%, transparent 36%); mask-image: linear-gradient(180deg, #000 0, #000 12%, transparent 36%); }
  .hero__head { text-align: center; padding-top: 4px; flex: none; }
  .hero__t { margin: 0; font: 400 2.5rem/3rem var(--db-font-display); color: var(--db-ritual-text); text-shadow: 0 1px 14px rgb(0 0 0 / .7); }
  /* the hero diya art (D-047): hero-unlit is scaled to 94% of the width and centred on the PAIR (pair centre = 1.011 x width below the image top), so both diyas sit fully inside the frame with ~20px air each side and above/below */
  .hstage { position: relative; flex: 1 1 176px; min-height: 176px; max-height: 480px; margin: 6px -16px 0; overflow: hidden; container-type: inline-size; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 82%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 82%, transparent 100%); }
  .hstage img, .hstage video { position: absolute; left: 4cqw; top: calc(50% - 92cqw * 1.011); width: 92cqw; height: auto; aspect-ratio: 720 / 1290; max-width: none; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 4%, #000 96%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 4%, #000 96%, transparent 100%); }
  .hstage video { opacity: 0; transition: opacity .6s ease; }
  .hstage video.on { opacity: 1; }
  .hstage::after { content: ""; position: absolute; left: 46%; top: 42%; width: 240px; height: 110px; margin: -55px 0 0 -120px; background: radial-gradient(ellipse closest-side, rgb(251 191 36 / .3), transparent 100%); mix-blend-mode: screen; pointer-events: none; }
  html.live .hstage::after { animation: glowp 2.8s ease-in-out infinite alternate; }
  /* live counter + goal */
  .hcount { position: relative; isolation: isolate; flex: none; display: grid; justify-items: center; text-align: center; margin-top: 4px; text-shadow: 0 1px 8px rgb(0 0 0 / .8); }
  .hcount[hidden] { display: none; }

  .hcount .odo, .hcount .odo * { text-shadow: none; }
  .hcount::before { content: ""; position: absolute; left: 50%; top: 0; width: 320px; height: 100%; margin-left: -160px; z-index: -1; border-radius: 50%; background: radial-gradient(ellipse closest-side, rgb(11 15 20 / .6) 0%, rgb(11 15 20 / .46) 62%, rgb(11 15 20 / 0) 100%); pointer-events: none; }
  .goal { width: min(260px, 80%); height: 8px; margin-top: 8px; border-radius: 4px; background: rgb(255 247 237 / .2); overflow: hidden; }
  .goal i { display: block; height: 100%; width: var(--p, 12%); min-width: 4px; border-radius: inherit; background: linear-gradient(90deg, var(--db-amber-300), var(--db-amber-500)); transition: width .8s ease; }
  .goal__t { font: 500 0.875rem/1.375rem var(--db-font-ui); color: rgb(255 247 237 / .92); }

  /* PHOTOWALL placeholder - real data = opted-in, moderated photos only (D-033). Mock = initial discs; no faces, no stock or AI photos. */
  .wall { position: relative; padding: 10px 0 0; }

  .wall__rows { display: grid; gap: 8px; }
  .wall__row { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14%, #000 86%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 14%, #000 86%, transparent 100%); }
  .wall__track { display: flex; width: max-content; animation: wallx 46s linear infinite; will-change: transform; }
  .wall__row:nth-child(even) .wall__track { animation-direction: reverse; }
  @keyframes wallx { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .wav { flex: none; width: 36px; height: 36px; box-sizing: border-box; margin-right: 8px; border-radius: 50%; border: 1.5px solid var(--rc); display: grid; place-items: center; background: var(--tile); color: var(--db-primary-800); font: 800 0.9375rem/1 'Martel', var(--db-font-ui); }

  /* D-047 sender message = a notification pop-up (not page layout): slides down from under the top bar, warm translucent dark glass */
  .ldot--amber { background: var(--db-amber-400); }
  /* the CTA block: overline + the page's ONE primary action (action colour #F97316) + a tiny line */
  .cta { flex: none; margin-top: auto; padding-top: 14px; display: grid; justify-items: center; gap: 10px; text-align: center; }

  .cta-go { position: relative; width: 100%; height: 56px; box-sizing: border-box; border: 0; border-radius: var(--db-radius-max); background: var(--db-primary-500); color: var(--db-base-0); font: 700 1.125rem/1.75rem var(--db-font-ui); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; padding: 0 20px; box-shadow: 0 0 22px color-mix(in srgb, var(--db-primary-500), transparent 62%); }
  .cta-go .ic { width: 24px; height: 24px; }

  html.live .cta-go::after, html[data-solo] .cta-go::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; animation: ctaring 2.2s ease-out infinite; }

  .step__ic { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgb(251 191 36 / .16); color: var(--db-amber-300); }

  .step__t { margin: 0; font: 500 1rem/1.625rem var(--db-font-ui); color: var(--db-ritual-text); }

  /* leaderboards */
  .tabs { display: flex; gap: 8px; margin: 0 0 12px; }

  @keyframes tkin { from { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; } to { max-height: 80px; opacity: 1; } }
  .tk__t { min-width: 0; flex: 1; display: grid; }
  .tk__nm { font: 800 0.875rem/1.375rem 'Martel', var(--db-font-ui); color: var(--db-ritual-text); overflow-wrap: anywhere; }
  .tk__a { font: 400 0.875rem/1.375rem var(--db-font-ui); color: rgb(255 247 237 / .72); }
  .tk svg { flex: none; }
  /* ===== 10 live tracker: the full-screen page behind the "लाइव" pill ===== */
  .trk { background: var(--db-ritual-bg); }
  .trk__sc { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 64px 16px 32px; display: grid; gap: 28px; align-content: start; }
  .trk__sc::-webkit-scrollbar { display: none; }
  .trk__big { display: grid; justify-items: center; text-align: center; padding: 20px 16px; border-radius: var(--db-radius-xxl); background: radial-gradient(ellipse 80% 90% at 50% 30%, rgb(251 191 36 / .16), rgb(255 247 237 / .04)); border: 1px solid rgb(251 191 36 / .35); }
  .trk__big p { margin: 0; }
  .trk__big .odo { --oh: 3.25rem; font-size: 3rem; margin: 4px 0 0; }
  .trk__tag { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: var(--db-radius-max); background: rgb(11 15 20 / .5); border: 1px solid rgb(255 247 237 / .22); font: 600 0.875rem/1.375rem var(--db-font-ui); color: var(--db-ritual-text); }
  .trk__h { margin: 0 0 12px; font: 400 1.375rem/2rem var(--db-font-display); color: var(--db-ritual-text); display: flex; align-items: center; gap: 8px; }

  /* ===== 03 Light ===== */
  /* --wx/--wy = the right (unlit) wick of hero-wicks.jpg (cover geometry, set in geo()). D-048: ONE control = a single TAP anywhere on the diya area (a 300px-tall invisible band); a pointing hand taps the wick on a loop. */
  .light { --wx: 216px; --wy: 432px; }
  .light .rit__top-scrim { height: 270px; background: linear-gradient(180deg, rgb(0 0 0 / .82) 0%, rgb(0 0 0 / .55) 55%, transparent 100%); }
  .light__title { position: absolute; inset: 100px 24px auto; margin: 0; text-align: center; color: var(--db-ritual-text); font-size: 1.625rem; line-height: 2.25rem; z-index: 3; text-shadow: 0 1px 10px rgb(0 0 0 / .7); transition: opacity .5s ease; }
  .altar__target { position: absolute; z-index: 4; left: 0; width: 100%; height: 300px; top: calc(var(--wy) - 150px); border: 0; padding: 0; background: transparent; color: var(--db-ritual-text); cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: opacity .4s ease; }
  .altar__target:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: -4px; }
  /* the tap signifier: origin = the wick; the hand's fingertip sits ~6px under it */
  .tapsig { position: absolute; left: var(--wx); top: 150px; width: 0; height: 0; pointer-events: none; }
  .tapsig__r { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--db-amber-300); opacity: 0; animation: tapripple 1.9s ease-out infinite; }
  .tapsig__h { position: absolute; left: -20px; top: 0px; width: 64px; height: 64px; fill: var(--db-ritual-text); filter: drop-shadow(0 2px 8px rgb(0 0 0 / .7)); transform-origin: 50% 24%; animation: taphand 1.9s ease-in-out infinite; }
  @keyframes taphand { 0%, 100% { transform: translateY(8px) scale(1); } 22% { transform: translateY(0) scale(.84); } 36% { transform: translateY(8px) scale(1); } }
  @keyframes tapripple { 0%, 18% { transform: scale(.35); opacity: 0; } 24% { opacity: .95; } 80%, 100% { transform: scale(1.7); opacity: 0; } }
  .altar__lb { position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(var(--wy) + 84px); margin: 0; padding: 0 12px; height: 32px; display: inline-flex; align-items: center; white-space: nowrap; border-radius: var(--db-radius-max); background: rgb(11 15 20 / .7); color: var(--db-ritual-text); font: 600 0.875rem/1.375rem var(--db-font-ui); pointer-events: none; transition: opacity .4s ease; }
  .light__fade { position: absolute; inset: auto 0 0; height: 58%; background: linear-gradient(0deg, rgb(0 0 0 / .94), rgb(0 0 0 / .7) 55%, transparent); z-index: 2; pointer-events: none; }
  /* the mantra (D-048): centred lower-middle, 22/34 Martel 800 Amber/300 on a strong scrim; each line is revealed with the audio */
  .light__foot { position: absolute; left: 0; right: 0; top: 584px; bottom: auto; padding: 0 20px; text-align: center; z-index: 4; }
  .light__foot p { margin: 0; }
  .light__foot .shloka { color: var(--db-amber-400); opacity: 1; font: 800 1.375rem/2.25rem 'Martel', var(--db-font-ui); text-shadow: 0 1px 12px rgb(0 0 0 / .9); text-wrap: balance; }
  .light__foot .shloka span { display: block; opacity: .85; transition: opacity .25s linear; }
  .light__foot .shloka span + span { margin-top: 10px; }
  .light.lighting .altar__target, .light.lighting .altar__lb, .light.lighting .light__title { opacity: 0; pointer-events: none; }
  .bloom { position: absolute; z-index: 1; width: 360px; height: 360px; left: calc(var(--wx) - 180px); top: calc(var(--wy) - 250px); border-radius: 50%; background: radial-gradient(circle, rgb(251 191 36 / .55), rgb(249 115 22 / .22) 40%, transparent 70%); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; mix-blend-mode: screen; }
  .lit-img { opacity: 0; transition: opacity 1.2s ease; }
  .light.fallback .lit-img { opacity: 1; }
  .light.fallback .bloom { opacity: 1; }

  /* ===== 04 Prayer: dark ritual top (the lit pair) + a warm sheet with a 3-step mini-flow ===== */
  .pr { display: flex; flex-direction: column; background: var(--db-ritual-bg); }
  /* hero-wicks-lit.jpg 720x1290 at full width (height:auto): flame tips at ~18% of the art height; the frame fades into the night before the bowls are cut */
  .pr__art { position: relative; flex: none; height: 250px; overflow: hidden; container-type: inline-size; background: var(--db-ritual-bg); }
  .pr__art .bgm { -webkit-mask-image: linear-gradient(180deg, #000 0, #000 60%, transparent 96%); mask-image: linear-gradient(180deg, #000 0, #000 60%, transparent 96%); }
  .pr__art .bgm img { inset: auto; left: 0; top: -50cqw; width: 100%; height: auto; object-fit: fill; }
  .pr__art::before { content: ""; position: absolute; inset: 0 0 auto; height: 96px; z-index: 2; background: linear-gradient(180deg, rgb(0 0 0 / .72), transparent); pointer-events: none; }
  .pr__sheet { position: relative; z-index: 6; margin-top: -20px; flex: 1; min-height: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--db-primary-50), var(--db-base-0) 70%); color: var(--db-text-primary); border-radius: var(--db-radius-xxl) var(--db-radius-xxl) 0 0; }
  .pr__scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px 16px 8px; display: grid; gap: 20px; align-content: start; scrollbar-width: thin; }
  .pr__scroll [hidden] { display: none !important; }
  .pr__step { display: grid; gap: 8px; align-content: start; }
  .pr__h { margin: 0; font: 600 1.25rem/1.75rem var(--db-font-ui); color: var(--db-text-primary); }
  .pr__grp { margin: 8px 0 0; font: 600 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-700); }
  .pr__grp:first-child { margin-top: 0; }
  .chipflow { display: flex; flex-wrap: wrap; gap: 8px; }
  .chipflow .db-chip { height: 40px; padding: 0 14px; gap: 4px; background: var(--db-base-0); font: 500 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-700); }
  .chipflow .db-chip.is-selected { background: var(--db-primary-100); border: 1.5px solid var(--db-primary-500); color: var(--db-primary-800); font-weight: 600; padding: 0 13px; }
  .chipflow .db-chip:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .pr__sum { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pr__sum .db-chip { flex: 0 1 auto; min-width: 0; white-space: normal; height: auto; min-height: 40px; }
  .pr__sum .db-btn { flex: none; height: 40px; color: var(--db-primary-700); }
  .pcard { position: relative; background: var(--db-base-0); border: 1px solid var(--db-primary-200); border-radius: var(--db-radius-xl); padding: 16px 56px 16px 16px; min-height: 72px; box-sizing: border-box; }
  .pcard__t { margin: 0; font: 800 1.1875rem/1.875rem 'Martel', var(--db-font-ui); color: var(--db-primary-800); text-wrap: pretty; word-break: normal; overflow-wrap: anywhere; }
  .pcard__t.is-empty { font: 400 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-700); }
  .pcard__edit { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--db-primary-50); color: var(--db-primary-700); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .pcard__edit:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .pedit { display: grid; gap: 4px; }
  .pedit textarea { box-sizing: border-box; width: 100%; min-height: 80px; padding: 8px 12px; border-radius: var(--db-radius-l); border: 1px solid var(--db-border-strong); background: var(--db-base-0); color: var(--db-text-primary); font: 400 1rem/1.625rem var(--db-font-ui); resize: none; }
  .pedit textarea:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .pedit span { justify-self: end; font: 400 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-700); }
  .pr .db-label { font: 600 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-700); }
  .pr__priv { margin: 0; color: var(--db-base-700); font: 500 0.875rem/1.375rem var(--db-font-ui); display: flex; gap: 8px; align-items: flex-start; }
  .pr__priv .ic { color: var(--db-base-700); margin-top: 1px; }
  .pr__foot { flex: none; padding: 8px 16px 16px; background: var(--db-base-0); }
  .pr__foot .db-btn { width: 100%; height: 52px; }

  /* ===== 05 Celebration card (fully animated in live mode; without .play it shows the finished frame) ===== */
  .celscr { display: flex; flex-direction: column; background: var(--db-ritual-bg); }
  .cel { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; container-type: inline-size; isolation: isolate; background: var(--db-ritual-bg); }
  /* D-032: no text selection / callout on the card art; taps are crackers */
  .cel, .cel * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .cel { touch-action: manipulation; }
  .cel__bg { position: absolute; inset: 0; transform: scale(1.06); }
  .plx { position: absolute; inset: 0; pointer-events: none; will-change: transform; }
  .plx--f { z-index: 2; } .plx--t { z-index: 3; }
  .cel__bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; max-width: none; }
  /* night behind the art: deep indigo to maroon, so the pigments pop */
  .cel__dim { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(30 27 75 / .84) 0%, rgb(49 20 84 / .72) 46%, rgb(76 5 25 / .84) 100%); }
  #fx, #pet { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #pet { z-index: 4; }
  /* toran: marigold strings + mango leaves */
  .toran { position: absolute; left: -12px; top: 64px; width: calc(100% + 24px); height: auto; z-index: 3; pointer-events: none; overflow: visible; }
  .toran .m1 { fill: #FACC15; } .toran .m2 { fill: #F97316; } .toran .m3 { fill: #FBBF24; } .toran .m4 { fill: #EA580C; }
  .toran .rs { fill: #F472B6; } .toran .rc { fill: #BE185D; }
  .toran .mc { fill: var(--db-primary-800); opacity: .4; }
  .toran .lf { fill: var(--db-green-600); } .toran .lf2 { fill: var(--db-green-700); }
  .toran .rope { stroke: var(--db-amber-700); stroke-width: 3; fill: none; stroke-linecap: round; }
  .toran .str { transform-box: fill-box; transform-origin: 50% 0%; }
  html.live .toran .str { animation: sway 3.4s ease-in-out infinite alternate; animation-delay: var(--sd, 0s); }
  @keyframes sway { from { transform: rotate(-2.6deg); } to { transform: rotate(2.6deg); } }
  /* diya pair: a feathered crop of hero-lit.jpg (720x1290, crop y 520-880) */
  .cel__glow { position: absolute; z-index: 3; left: 50%; bottom: 114px; width: 100cqw; height: 100cqw; margin-left: -50cqw; margin-bottom: -22cqw; border-radius: 50%; background: radial-gradient(circle, rgb(251 191 36 / .42), rgb(249 115 22 / .16) 38%, transparent 66%); mix-blend-mode: screen; pointer-events: none; }
  html.live .cel__glow { animation: glowp 2.8s ease-in-out infinite alternate; }
  @keyframes glowp { from { opacity: .8; } to { opacity: 1; } }
  .cel__diya { position: absolute; z-index: 4; left: 50%; bottom: 114px; width: min(68cqw, 300px); aspect-ratio: 2 / 1; transform: translateX(-50%); }
  .cel__diya i { position: absolute; inset: 0; background: url("images/hero-lit.jpg") 0% 55.9% / 100% auto no-repeat; -webkit-mask-image: radial-gradient(ellipse 60% 62% at 50% 56%, #000 62%, transparent 98%); mask-image: radial-gradient(ellipse 60% 62% at 50% 56%, #000 62%, transparent 98%); }
  /* rangoli: traditional powder colours, set per element with --c */
  .rangoli { position: absolute; z-index: 3; left: 50%; bottom: 24px; width: 92cqw; max-width: 400px; transform: translateX(-50%); height: auto; pointer-events: none; overflow: visible; }
  .rangoli .rg { fill: var(--c); fill-opacity: var(--fo, .6); stroke: var(--c); stroke-width: 1.3; stroke-dasharray: 1; stroke-dashoffset: 0; stroke-linecap: round; stroke-linejoin: round; }
  .rangoli .rg--ring { fill: none; }
  .rangoli .rd { fill: var(--c); transform-box: fill-box; transform-origin: 50% 50%; }
  /* D-044 final: pride + share intent. A column in the open sky: join message, hero counter (+1), "आप दीया नंबर N हैं", goal bar, then the portrait + prayer. The ground (rangoli, diya pair, deepmala) sits below it. */
  .cflow { position: absolute; z-index: 5; left: 0; right: 0; top: 150px; bottom: 176px; padding: 0 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; pointer-events: none; }
  .cflow::before { content: ""; position: absolute; z-index: -1; inset: -10px -8px -2px; background: radial-gradient(ellipse closest-side at 50% 50%, rgb(11 15 20 / .64) 0%, rgb(11 15 20 / .52) 64%, rgb(11 15 20 / 0) 100%); pointer-events: none; }
  .cflow p, .cflow h1 { margin: 0; }
  .c-join { font: 400 1.625rem/2.125rem var(--db-font-display); color: var(--db-ritual-text); text-shadow: 0 1px 12px rgb(0 0 0 / .6); text-wrap: balance; }
  .c-count { display: flex; justify-content: center; margin-top: 18px; }
  .c-count[hidden] { display: none; }
  .c-num { font: 400 1rem/1.625rem var(--db-font-ui); color: var(--db-ritual-text); }
  .c-num .num { font: 700 1.5rem/2rem var(--db-font-latin); color: var(--db-amber-400); margin: 0 2px; }
  .c-goal { display: grid; justify-items: center; }
  .c-goal .goal { margin-top: 2px; }
  .c-prow { display: flex; align-items: center; gap: 10px; text-align: left; max-width: 328px; min-height: 64px; margin-top: 2px; }
  .c-pw { position: relative; flex: none; width: 64px; height: 64px; }
  .c-ptxt { min-width: 0; display: grid; gap: 2px; }
  .c-prayer { font: 800 1.125rem/1.75rem 'Martel', var(--db-font-ui); color: var(--db-ritual-text); text-wrap: pretty; overflow-wrap: anywhere; text-shadow: 0 1px 12px rgb(0 0 0 / .6); }
  .c-prayer .w { display: inline-block; }
  .c-from { font: 400 0.875rem/1.375rem var(--db-font-ui); color: rgb(255 247 237 / .88); }
  /* live counter: HERO block in the open sky between the prayer and the diyas (D-021 placeholder) */
  .dy::after { content: ""; position: absolute; width: 16px; height: 16px; margin: -8px; background: #FDE68A; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); opacity: 0; pointer-events: none; }
  .hero-count { position: relative; display: grid; justify-items: center; padding: 4px 18px 6px; line-height: 1.3; border-radius: 20px; background: rgb(11 15 20 / .35); border: 1px solid rgb(251 191 36 / .25); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); text-align: center; }
  .hero-count p { margin: 0; }
  .hc-over { font: 400 0.875rem/1.375rem var(--db-font-ui); color: rgb(255 247 237 / .85); }
  .hc-lbl { font: 400 1rem/1.625rem var(--db-font-ui); color: var(--db-ritual-text); }
  .odo { --oh: 3rem; position: relative; display: flex; justify-content: center; height: var(--oh); font: 700 2.75rem/var(--oh) var(--db-font-latin); font-variant-numeric: tabular-nums; filter: drop-shadow(0 0 18px rgb(251 191 36 / .45)); direction: ltr; }
  .odo .dg { position: relative; display: block; width: .62em; height: var(--oh); overflow: hidden; }
  .odo .rl { display: block; transition: transform 1.4s cubic-bezier(.16, .84, .3, 1); will-change: transform; }
  .odo .rl.snap { transition: none; }
  .odo .rl b, .odo .cm { display: block; height: var(--oh); font: inherit; background: linear-gradient(180deg, var(--db-amber-300), var(--db-amber-500)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .odo .cm { width: .3em; text-align: center; }
  .odo .rl.fast { transition-duration: .7s; }
  .odo::after { content: ""; position: absolute; right: -6px; top: -4px; width: 20px; height: 20px; background: var(--db-amber-200); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); opacity: .85; pointer-events: none; }
  .odo.burst::after { animation: twink 1s ease-out; }
  /* compact hero version (f1): Inter Bold 32/36, same component */
  .odo--sm { --oh: 2.25rem; font-size: 2rem; }
  .odo--sm::after { right: -4px; top: -2px; width: 14px; height: 14px; }
  .plus1 { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); z-index: 2; display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: var(--db-radius-max); background: var(--db-amber-400); color: var(--db-base-950); font: 600 0.875rem/1.375rem var(--db-font-ui); white-space: nowrap; }
  html.live .cel.play:not(.joined) .plus1 { opacity: 0; }
  .cel.joined .plus1 { animation: chipfly 2.4s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes chipfly { 0% { opacity: 0; transform: translate(-50%, 150px) scale(.8); } 18% { opacity: 1; } 62% { opacity: 1; transform: translate(-50%, 0) scale(1); } 85% { opacity: 1; transform: translate(-50%, 26px) scale(1); } 100% { opacity: 0; transform: translate(-50%, 36px) scale(.8); } }
  .dy::after { left: 50%; bottom: 26px; width: 20px; height: 20px; margin: 0 0 0 -10px; background: #FFF7ED; }
  .dy.flare::after { animation: twink .8s ease-out; }
  @keyframes twink { 0% { opacity: 0; transform: scale(.2) rotate(0); } 30% { opacity: 1; transform: scale(1.15) rotate(45deg); } 100% { opacity: 0; transform: scale(.6) rotate(90deg); } }
  /* 7 small diyas along the bottom; each is a 40px tap target */
  .cel__row { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: flex-end; }
  .dyb { width: 40px; height: 44px; border: 0; padding: 0 0 10px; background: none; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .dyb:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: -2px; border-radius: 12px; }
  .dy { position: relative; display: block; width: 22px; height: 12px; border-radius: 3px 3px 11px 11px; background: linear-gradient(180deg, var(--db-primary-600), var(--db-primary-900)); }
  .dy .fl { position: absolute; left: 50%; bottom: 10px; width: 8px; height: 14px; margin-left: -4px; transform-origin: 50% 100%; }
  .dy .fl::before { content: ""; position: absolute; inset: 0; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: radial-gradient(circle at 50% 72%, var(--db-primary-50), var(--db-amber-400) 55%, var(--db-primary-600)); box-shadow: 0 0 10px 3px rgb(251 191 36 / .55); transform-origin: 50% 100%; }
  html.live .dy .fl::before { animation: flick 1.3s ease-in-out infinite alternate; }
  html.live .dy.flare .fl::before { animation: flare .8s ease-out; }
  @keyframes flick { from { transform: scale(1, .92); } to { transform: scale(.9, 1.08); } }
  @keyframes flare { 0% { transform: scale(1); } 30% { transform: scale(2.1, 2.4); box-shadow: 0 0 22px 9px rgb(253 230 138 / .85); } 100% { transform: scale(1); } }
  /* one-time hint pill + petal button + toast */
  .hint { position: absolute; z-index: 6; left: 50%; bottom: 62px; transform: translateX(-50%); margin: 0; padding: 6px 14px; border-radius: var(--db-radius-max); background: rgb(11 15 20 / .72); color: var(--db-ritual-text); font: 400 0.875rem/1.375rem var(--db-font-ui); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .hint.show { opacity: 1; }
  .flowerbtn { position: absolute; z-index: 6; right: 12px; bottom: 236px; }
  .toast { position: absolute; z-index: 15; left: 50%; bottom: calc(26% + 16px); transform: translate(-50%, 8px); margin: 0; padding: 8px 16px; border-radius: var(--db-radius-max); background: rgb(11 15 20 / .86); color: var(--db-ritual-text); font: 500 0.875rem/1.375rem var(--db-font-ui); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .4s ease, transform .4s ease; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* D-029 optional photo (f4) + garland portrait (f6): photo stays in memory only */
  .ph { display: flex; align-items: center; gap: 4px; margin: 8px 0 12px; }
  .ph__main { flex: 1; min-width: 0; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; text-align: left; font-family: var(--db-font-ui); cursor: pointer; }
  .ph__main:focus-visible, .ph__x:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; border-radius: var(--db-radius-m); }
  .ph__ring { position: relative; flex: none; width: 56px; height: 56px; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed var(--db-primary-300); background: var(--db-primary-50) center / cover no-repeat; color: var(--db-primary-700); display: grid; place-items: center; overflow: hidden; }
  .ph.has .ph__ring { border-style: solid; border-color: var(--db-primary-300); }
  .ph.has .ph__ring svg { display: none; }
  .ph__t { display: grid; min-width: 0; }
  .ph__t b { font: 600 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-900); }
  .ph__t span { font: 400 0.75rem/1.125rem var(--db-font-ui); color: var(--db-base-700); }
  .ph.has .ph__t span { font-weight: 600; color: var(--db-primary-700); }
  .ph__x { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--db-primary-50); color: var(--db-primary-700); display: grid; place-items: center; padding: 0; cursor: pointer; }
  .ph__x[hidden] { display: none; }
  .ph__wall { display: flex; align-items: flex-start; gap: 8px; min-height: 40px; margin: 0 0 12px; padding: 8px 12px; border-radius: var(--db-radius-m); background: var(--db-primary-50); border: 1px solid var(--db-primary-200); }
  .ph__wall[hidden] { display: none; }
  .ph__wall .db-check { align-items: flex-start; min-height: 40px; gap: 12px; font: 500 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-900); }
  .ph__wall .db-check input { flex: none; margin-top: 1px; }
  .ph__wall .db-check input:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .ph__wall .db-check span { display: grid; }
  .ph__wall small { font: 400 0.75rem/1.125rem var(--db-font-ui); color: var(--db-base-700); }
  .ph__err { margin: 4px 0 0; font: 500 0.875rem/1.375rem var(--db-font-ui); color: var(--db-error-700); }
  .c-port { position: relative; justify-self: center; width: 108px; height: 108px; margin: -22px 0 -26px; transform: scale(.72); }
  .c-port[hidden] { display: none; }
  .c-port__glow { position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle closest-side, rgb(251 191 36 / .5) 0%, rgb(249 115 22 / .22) 55%, transparent 100%); }
  .c-port__g { position: absolute; inset: 0; width: 108px; height: 108px; overflow: visible; }
  .c-port__ph { position: absolute; left: 12px; top: 12px; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; background: var(--db-primary-100); display: grid; place-items: center; }
  .c-port__ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .c-port__ph span { font: 800 1.75rem/2.25rem 'Martel', var(--db-font-ui); color: var(--db-primary-800); }
  .c-port .sp { opacity: 0; }
  .cel.play .c-port__g { animation: garin .7s var(--pd, 2.6s) cubic-bezier(.2,1.4,.4,1) both; transform-origin: 50% 50%; }
  .cel.play .c-port__glow { animation: glowin .9s var(--pd, 2.6s) ease-out both; }
  .cel.play .c-port__ph { animation: txtin .6s calc(var(--pd, 2.6s) + .3s) ease both; }
  .cel.play .c-port .sp { animation: spark .9s calc(var(--pd, 2.6s) + .35s) ease-out both; }
  @keyframes garin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes spark { 0% { opacity: 0; transform: translate(0, 0) scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1); } }
  /* sequence (live only): 0 diya rises, .6 toran, 1.0 rangoli, 1.6 diya row, 2.0 fireworks (JS), 2.6 text, 3.2 counter */
  .cel.play .cel__diya { animation: rise 1.3s cubic-bezier(.2,.8,.2,1) both; }
  .cel.play .cel__glow { animation: glowin 1.6s ease-out both, glowp 2.8s 1.6s ease-in-out infinite alternate; }
  .cel.play .toran { animation: drop 1s .6s cubic-bezier(.2,1.5,.4,1) both; }
  .cel.play .rg { animation: rgdraw 1.1s var(--d, 1s) ease-out both; }
  .cel.play .rd { animation: dotin .5s var(--d, 1s) cubic-bezier(.3,1.6,.5,1) both; }
  .cel.play .dy .fl { animation: flameon .5s calc(1.6s + var(--i) * .18s) cubic-bezier(.3,1.6,.5,1) both; }
  .cel.play .c-join { animation: txtin .7s .5s ease both; }
  .cel.play .c-count { animation: txtin .7s 1s ease both; }
  .cel.play .c-num, .cel.play .c-goal { animation: txtin .7s 3.4s ease both; }
  .cel.play .cflow::before { animation: pin .8s .4s ease both; }
  .cel.play .c-prayer .w { animation: wordin .55s ease both; }
  .cel.play .c-from { animation: txtin .7s ease both; animation-delay: var(--d); }
  @keyframes rise { from { transform: translate(-50%, 300px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes glowin { from { opacity: 0; } to { opacity: 1; } }
  @keyframes drop { from { transform: translateY(-110%); } to { transform: none; } }
  @keyframes rgdraw { from { stroke-dashoffset: 1; fill-opacity: 0; } 70% { fill-opacity: 0; } to { stroke-dashoffset: 0; fill-opacity: var(--fo, .6); } }
  @keyframes dotin { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes flameon { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes txtin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes wordin { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes pin { from { opacity: 0; } to { opacity: 1; } }
  /* action area: the one saffron CTA, then two text buttons side by side */
  .cel__acts { flex: 0 0 auto; display: grid; gap: 4px; padding: 12px 16px 12px; background: linear-gradient(180deg, rgb(11 15 20 / 0), var(--db-ritual-bg) 24px); margin-top: -24px; position: relative; z-index: 4; }
  .cel__acts .db-btn { width: 100%; height: 52px; }
  .cel__row2 { display: flex; gap: 8px; }
  .cel__lnk { flex: 1 1 0; min-width: 0; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; border: 0; border-radius: var(--db-radius-l); background: transparent; color: var(--db-ritual-text); font: 500 0.875rem/1.375rem var(--db-font-ui); text-decoration: none; cursor: pointer; }
  .cel__lnk:hover { background: rgb(255 247 237 / .1); }
  .cel__lnk:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .wa-ic { width: 24px; height: 24px; flex: none; }
  /* the user's rangoli bitmap replaces the SVG rangoli on the card (same ground-plane geometry: width 92cqw, squashed to .5) */
  .rangoli-img { display: none; position: absolute; z-index: 3; left: 50%; bottom: 24px; width: 92cqw; max-width: 400px; aspect-ratio: 1; transform: translateX(-50%) scaleY(.5); transform-origin: 50% 100%; pointer-events: none; }
  .cel.has-rg .rangoli-img { display: block; }
  .cel.has-rg .rangoli { display: none; }
  .cel.play .rangoli-img { animation: rgreveal 1.3s 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rgreveal { from { opacity: 0; transform: translateX(-50%) scale(.82, .41); } to { opacity: 1; transform: translateX(-50%) scaleY(.5); } }

  /* ===== 05 Rangoli (D-027): ritual dark, warm radial, the canvas on a dark-terracotta floor disc ===== */
  .rgs { background: radial-gradient(ellipse 85% 48% at 50% 44%, rgb(124 45 18 / .5), transparent 72%), var(--db-ritual-bg); }
  .rgs__body { position: absolute; left: 0; right: 0; top: 64px; bottom: 96px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 24px 16px 0; }
  .rgs__title { margin: 0; text-align: center; color: var(--db-ritual-text); font: 400 1.75rem/2.375rem var(--db-font-display); }
  .rgs__sub { margin: 4px 0 0; max-width: 300px; text-align: center; text-wrap: balance; color: rgb(255 247 237 / .75); font: 400 0.875rem/1.375rem var(--db-font-ui); }
  .rgs__floor { position: relative; flex: none; width: min(320px, 88vw); aspect-ratio: 1; margin-top: 20px; }
  .rgs__floor::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; background: radial-gradient(circle, rgb(124 45 18 / .72) 0%, rgb(96 35 15 / .58) 62%, rgb(76 29 12 / .42) 100%); border: 1px solid rgb(255 247 237 / .1); }
  .rgs__guide, #rgcv { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
  .rgs__guide { pointer-events: none; fill: none; stroke: rgb(255 247 237 / .12); stroke-width: 1.2; stroke-dasharray: 0 3.2; stroke-linecap: round; }
  #rgcv { touch-action: auto; -webkit-user-select: none; user-select: none; }
  .rgs__foot { position: absolute; left: 16px; right: 16px; bottom: 24px; z-index: 5; }
  .rgs__foot .db-ritual-cta.is-idle { opacity: .72; }

  /* ===== 07 Share sheet (D-028): bottom sheet over the card ===== */
  .shscrim { position: absolute; inset: 0; z-index: 19; background: rgb(11 15 20 / .62); }
  .shsheet { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; max-height: 94%; overflow-y: auto; display: grid; gap: 12px; padding: 8px 16px 16px; box-sizing: border-box; background: linear-gradient(180deg, var(--db-primary-50), var(--db-base-0) 70%); color: var(--db-text-primary); border-radius: var(--db-radius-xxl) var(--db-radius-xxl) 0 0; box-shadow: var(--db-shadow-xl); }
  .shsheet[hidden], .shscrim[hidden] { display: none; }
  .shsheet:not([hidden]) { animation: shup .34s cubic-bezier(.2,.8,.2,1) both; }
  .shscrim:not([hidden]) { animation: pin .3s ease both; }
  @keyframes shup { from { transform: translateY(100%); } to { transform: none; } }
  .shsheet__grab { justify-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--db-border-strong); }
  .shsheet__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .shsheet h2 { margin: 0; font: 600 1.25rem/1.875rem var(--db-font-ui); color: var(--db-text-primary); }
  .shx, .shbub__ed { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; padding: 0; cursor: pointer; background: var(--db-primary-100); color: var(--db-primary-800); }
  .shx:focus-visible, .shbub__ed:focus-visible, .shsheet .db-btn:focus-visible, .shsheet .db-input:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .shsheet .db-label { font: 600 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-700); }
  .shsheet .db-btn { width: 100%; height: 52px; }
  /* WhatsApp-style preview (the one place the WhatsApp green bubble is allowed) */
  .shchat { display: flex; align-items: flex-end; justify-content: flex-end; gap: 8px; padding: 12px; border-radius: var(--db-radius-l); background: #EFEAE2; }
  .shbub { flex: 1 1 0; min-width: 0; box-sizing: border-box; padding: 8px 12px; border-radius: 8px 8px 0 8px; background: #D9FDD3; color: #111B21; }
  .shbub__t { margin: 0; font: 400 0.875rem/1.375rem var(--db-font-ui); overflow-wrap: anywhere; }
  .shbub__t .mt { font-size: 0.875rem; line-height: 1.375rem; }
  .shbub__t .num { font-family: var(--db-font-latin); font-weight: 600; }
  .shbub textarea { box-sizing: border-box; width: 100%; min-height: 96px; padding: 8px; border-radius: 8px; border: 1px solid rgb(17 27 33 / .25); background: rgb(255 255 255 / .6); color: #111B21; font: 400 0.875rem/1.375rem var(--db-font-ui); resize: none; }
  .shbub textarea:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .shbub [hidden] { display: none; }

  /* the flame that lifts off the card, with its sparkle trail */
  .flyf { position: absolute; left: 0; top: 0; z-index: 16; width: 16px; height: 26px; margin: -13px 0 0 -8px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: radial-gradient(circle at 50% 72%, var(--db-primary-50), var(--db-amber-400) 55%, var(--db-primary-600)); box-shadow: 0 0 16px 6px rgb(251 191 36 / .6); pointer-events: none; will-change: transform; }
  .spk2 { position: absolute; left: 0; top: 0; z-index: 15; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: var(--db-amber-400); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); pointer-events: none; }

  /* ===== D-035 prayer: ONE question per screen (Q1 who / Q2 prayer / Q3 name), 3-dot step indicator + back arrow ===== */
  .ic-st { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .pr__nav { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0; }
  .pr__back { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--db-primary-100); color: var(--db-primary-800); display: grid; place-items: center; padding: 0; cursor: pointer; }
  .pr__back:focus-visible, .qtile:focus-visible, .qrow:focus-visible, .qmore:focus-visible, .shopt__t:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .pr__sp { width: 40px; height: 40px; }
  .pr__dots { display: flex; align-items: center; gap: 6px; }
  .pr__dots i { display: block; width: 8px; height: 8px; border-radius: var(--db-radius-max); background: var(--db-primary-200); transition: width .25s ease, background .25s ease; }
  .pr__dots i.done { background: var(--db-primary-500); }
  .pr__dots i.on { width: 24px; background: var(--db-primary-500); }
  .pr__scroll { padding-top: 8px; }
  .pr__q { display: grid; gap: 16px; align-content: start; }
  .qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .qtile { height: 96px; box-sizing: border-box; min-width: 0; padding: 8px; border: 1px solid var(--db-primary-200); border-radius: var(--db-radius-xl); background: var(--db-primary-50); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--db-text-primary); font: 600 1rem/1.5rem var(--db-font-ui); text-align: center; }
  .qtile svg { width: 56px; height: 40px; flex: none; fill: none; stroke: var(--db-primary-700); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .qtile svg .d { fill: var(--db-primary-200); }
  .qtile svg .a { fill: var(--db-amber-300); }
  .qtile.is-picked, .qrow.is-picked { background: var(--db-primary-100); border-color: var(--db-primary-500); box-shadow: inset 0 0 0 1px var(--db-primary-500); }
  .qmore { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; min-height: 44px; border: 0; border-radius: var(--db-radius-l); background: none; color: var(--db-primary-700); font: 600 0.875rem/1.375rem var(--db-font-ui); cursor: pointer; }
  .qmore .ic { transition: transform .2s ease; }
  .qmore[aria-expanded="true"] .ic { transform: rotate(180deg); }
  .qlist { display: grid; gap: 8px; }
  .qlist { margin-top: 8px; }
  .pr__h--ui { font-family: 'Noto Sans Devanagari', var(--db-font-ui); font-weight: 700; }   /* D-113: a UI heading, not Yatra One */
  .qrow { min-height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px; border: 1px solid var(--db-border); border-radius: var(--db-radius-m); background: var(--db-base-0); color: var(--db-text-primary); font: 500 1rem/1.5rem var(--db-font-ui); text-align: left; cursor: pointer; }
  .qrow .ic { color: var(--db-primary-700); }
  #q2 .pcard { min-height: 120px; padding: 20px 56px 20px 20px; display: flex; align-items: center; }
  #q2 .pcard__t { font-size: 1.375rem; line-height: 2.125rem; }
  .wishrow { display: grid; gap: 8px; }
  .wishrow[hidden] { display: none; }
  #wishes { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
  #wishes::-webkit-scrollbar { display: none; }
  #wishes .db-chip { flex: none; }

  /* ===== D-037 share sheet: template -> send directly; recipient optional (collapsed) ===== */
  .shopt { display: grid; gap: 12px; }
  .shopt__t { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 44px; box-sizing: border-box; padding: 0 12px 0 16px; border: 1px solid var(--db-border); border-radius: var(--db-radius-m); background: var(--db-base-0); color: var(--db-primary-800); font: 500 0.875rem/1.375rem var(--db-font-ui); text-align: left; cursor: pointer; }
  .shopt__t .ic { transition: transform .2s ease; }
  .shopt__t[aria-expanded="true"] .ic { transform: rotate(180deg); }
  .shopt__b { display: grid; gap: 12px; }
  .shopt__b[hidden] { display: none; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg__o { position: relative; min-width: 0; min-height: 120px; box-sizing: border-box; padding: 8px; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--db-border); border-radius: var(--db-radius-xl); background: var(--db-base-0); color: var(--db-text-primary); font-family: var(--db-font-ui); cursor: pointer; }
  .seg__o:focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }
  .seg__o[aria-checked="true"] { background: var(--db-primary-100); border-color: var(--db-primary-500); box-shadow: inset 0 0 0 1px var(--db-primary-500); }
  .seg__pv { position: relative; flex: none; width: 54px; height: 96px; border-radius: var(--db-radius-s, 8px); overflow: hidden; background: var(--db-base-950); }
  .seg__pv canvas { display: block; width: 100%; height: 100%; }
  .seg__play { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; display: grid; place-items: center; background: rgb(11 15 20 / .6); color: var(--db-ritual-text); }
  .seg__t { min-width: 0; display: grid; gap: 2px; }
  .seg__t b { font: 600 1rem/1.5rem var(--db-font-ui); color: var(--db-text-primary); }
  .seg__t small { font: 400 0.75rem/1.125rem var(--db-font-ui); color: var(--db-base-700); }
  .seg__ck { position: absolute; right: 6px; top: 6px; color: var(--db-primary-700); opacity: 0; }
  .seg__o[aria-checked="true"] .seg__ck { opacity: 1; }
  .shprog { margin: 0; display: grid; gap: 6px; font: 500 0.875rem/1.375rem var(--db-font-ui); color: var(--db-primary-800); }
  .shprog[hidden] { display: none; }
  .shprog__bar { display: block; height: 6px; border-radius: 3px; background: var(--db-primary-100); overflow: hidden; }
  .shprog__bar i { display: block; height: 100%; width: var(--p, 0%); background: var(--db-primary-500); border-radius: inherit; transition: width .25s linear; }
  .shnote { margin: 0; font: 500 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-700); }
  .shnote[hidden] { display: none; }
  .shsheet .db-btn[disabled] { opacity: .55; cursor: default; }
  .shhelp { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; color: var(--db-base-700); font: 400 0.75rem/1.125rem var(--db-font-ui); text-align: left; }
  .shhelp .ic { color: var(--db-base-700); }


  /* ===== v5 overrides: prayer steps (D-043), rangoli step, final screen (D-044/D-045), WhatsApp card ===== */
  .ic--12 { width: 12px; height: 12px; flex: none; fill: currentColor; }
  .pr__art { height: 250px; }
  .pr__scroll { padding-top: 20px; }
  .qtile { height: 112px; }
  .pr__sub { margin: -8px 0 0; font: 400 0.875rem/1.375rem var(--db-font-ui); color: var(--db-base-700); }
  .pr__foot { border-top: 1px solid var(--db-border); }
  .pr__foot[hidden] { display: none; }
  .pedit textarea#pta { min-height: 128px; padding: 12px 16px; border-radius: var(--db-radius-xl); border: 1px solid var(--db-primary-200); background: var(--db-base-0); color: var(--db-primary-800); font: 800 1.25rem/2rem 'Martel', var(--db-font-ui); }
  .pedit .db-label { margin: 0; }
  /* D-113: a visible edit mark on the prayer box: pencil (20px, cream 80%) + "बदलें", top-right inside the box */
  .pedit__box { position: relative; display: grid; }
  .pedit__box textarea#pta { padding-top: 44px; }
  .pedit__ed { position: absolute; top: 0; right: 4px; display: inline-flex; align-items: center; gap: 4px; min-width: 44px; height: 44px; padding: 0 8px; border: 0; background: none; color: rgb(255 247 237 / .8); font: 500 0.875rem/1.375rem var(--db-font-ui); cursor: pointer; }
  .pedit__ed .ic { flex: none; width: 20px; height: 20px; }
  .pedit__ed:focus-visible { outline: 2px solid var(--db-amber-300); outline-offset: -2px; border-radius: var(--db-radius-l); }
  .db-field { display: grid; gap: 4px; }
  .shsheet .cel__lnk, .pr .cel__lnk { flex: none; color: var(--db-primary-700); }
  .shsheet .cel__lnk:hover { background: var(--db-primary-100); }
  .ph__wall { margin: 0 0 4px; }
  /* final screen */
  .cel__acts { gap: 6px; padding: 10px 16px 14px; margin-top: 0; background: var(--db-ritual-bg); }
  .c-setup { margin: 0; text-align: center; font: 500 0.875rem/1.375rem var(--db-font-ui); color: rgb(255 247 237 / .92); text-wrap: balance; }
  /* D-051: ONE CTA (शेयर करें, saffron). Sky column on a soft dark scrim between the toran and the ground; the ground (rangoli + diya pair) is smaller so nothing overlaps. */

  .land .pg1:not(.pg1--me) .hstage, .land.nosend .pg1:not(.pg1--me) .hstage { min-height: 290px; }

  /* ===== r12 · D-086 (locked): the first screen = three zones with air. A hero (toran over the image, compact toast, diya, title) · B proof (number, avatars + label, goal line) · C action (CTA + free line) ===== */
  .land { --zg: clamp(20px, 3.5vh, 40px); --hD: 132px; --tor: 60px; }

  .land .pg1:not(.pg1--me) .hstage, .land.nosend .pg1:not(.pg1--me) .hstage { flex: 1 1 0; min-height: 300px; max-height: calc(var(--hD) + 69.4cqw + 56px); margin: 0 -16px; -webkit-mask-image: none; mask-image: none; }
  .land .pg1:not(.pg1--me) .hstage::after { display: none; }
  .land .pg1:not(.pg1--me) .hstage .htoran { position: absolute; z-index: 3; left: 0; right: 0; top: 0; width: auto; margin: 0; height: var(--tor); overflow: hidden; mix-blend-mode: screen; pointer-events: none; -webkit-mask-image: none; mask-image: none; }
  .land .pg1:not(.pg1--me) .hstage .htoran img { position: static; display: block; width: 100%; height: 100%; aspect-ratio: auto; object-fit: cover; object-position: 50% 0; -webkit-mask-image: none; mask-image: none; }

  /* ===== r13 · D-087 (one continuous top) + D-088 (accessibility + copy pass) ===== */
  /* -- D-087: no ticker row. The header is transparent over a #0B0F14 -> transparent gradient and the toran hangs straight from its bottom edge into the hero: no band, border, line or gap. Header text sits on >= .8 of #0B0F14 (cream on it: 15:1+). -- */
  .tbar { padding: 6px 12px; }
  .tbar::before { inset: 0 0 -18px; background: linear-gradient(180deg, rgb(11 15 20 / .94) 0, rgb(11 15 20 / .82) 30px, rgb(11 15 20 / .42) 54px, rgb(11 15 20 / 0) 100%); }

  .land { --tor: calc(100cqw * .2157); }   /* the toran at its natural 1080x233 proportions: bells complete, nothing cropped */
  .land .pg1:not(.pg1--me) .hstage .htoran { -webkit-mask-image: linear-gradient(180deg, transparent 0, rgba(0,0,0,.55) 14%, #000 34%, #000 62%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, rgba(0,0,0,.55) 14%, #000 34%, #000 62%, transparent 100%); }
  .land .pg1:not(.pg1--me) .hstage { margin-top: 0; }   /* its lower edge melts into the hero: no band */

  /* -- D-088 · tap targets: every control is 44x44 or more (visible size or an invisible hit area) -- */

  .screen :is(button, a[href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])):focus-visible { outline: 2px solid var(--db-primary-500); outline-offset: 2px; }

  .land .pg1:not(.pg1--me) .cta__free, .cta__tiny, .cta__tiny.cta__free { color: rgb(255 247 237 / .85); }

  /* -- 2 header: the title always shows; items sit closer on narrow phones -- */

  /* -- 4 bottom sheets: solid, scrollable, footer CTA sticky, full scrim -- */

  .shsheet, .upd { max-height: 92%; max-height: min(92%, 92vh); max-height: min(92%, 92dvh); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; background: var(--db-base-0); background-image: linear-gradient(180deg, var(--db-primary-50), var(--db-base-0) 70%); }

  /* -- 5 returning page: the ring scales down, never wider than the screen -- */
  .ringv { width: min(320px, 100%); height: auto; aspect-ratio: 1 / 1; }
  .ringv svg { width: 100%; height: 100%; }

  /* -- 6 live tracker counter = the landing's plain Inter counter; any reel is clipped to its own window -- */

  /* -- 7 light screen mantra: 4 lines, one half-verse each, centred, always inside the screen -- */
  .light__foot { top: auto; bottom: max(20px, env(safe-area-inset-bottom)); padding: 0 24px; box-sizing: border-box; }
  .light__foot .shloka { width: 100%; max-width: calc(100% - 0px); margin: 0 auto; font-size: clamp(1.125rem, 5.9vw, 1.375rem); line-height: 1.6; text-wrap: balance; }
  .light__foot .shloka > span { display: block; }

  /* -- 8 final: the title owns a band under the toran; fireworks stay out of it -- */
  .cel { --tb0: calc(44px + 21.57cqw); --cft: max(132px, calc(var(--tb0) + 8px)); --rt: max(178px, calc(var(--cft) + 46px)); }

  .cel__bg::after { height: calc(var(--cft) + 96px); background: linear-gradient(180deg, rgb(11 15 20 / .5) 0, rgb(11 15 20 / .5) var(--tb0), rgb(11 15 20 / .94) calc(var(--tb0) + 10px), rgb(11 15 20 / .94) calc(var(--cft) + 44px), rgb(11 15 20 / 0) 100%); }
  .plx--f { -webkit-mask-image: linear-gradient(180deg, #000 0, #000 var(--tb0), transparent calc(var(--tb0) + 10px), transparent calc(var(--cft) + 56px), #000 calc(var(--cft) + 96px)); mask-image: linear-gradient(180deg, #000 0, #000 var(--tb0), transparent calc(var(--tb0) + 10px), transparent calc(var(--cft) + 56px), #000 calc(var(--cft) + 96px)); }

  /* -- 9 big system fonts: boxes holding text grow (min-height, not height); rows wrap; chips and pills grow -- */
  .cta-go, .db-btn { height: auto !important; min-height: 3.25rem; padding-top: 0.5rem; padding-bottom: 0.5rem; text-align: center; }

  /* -- 10 D-089: every primary button is white on Primary/600 (#EA580C), pressed Primary/700; the focus ring stays -- */
  .screen .cta-go, .screen #howok, .screen #prnext, .screen #shgo, .screen #updgo { background: var(--db-primary-600); color: var(--db-base-0); }

  .c-hero { margin-top: calc(var(--rt) + var(--rw) / 2 + 58px - var(--cft) - 2.625rem); }

  /* ===== r17 · landing top = final-screen top (f9): art + painted toran start at y=0 behind a transparent header ===== */
  /* z-order like f9: art, then toran, then header (.tbar z 40). The stage is pulled up under the header; no band, no fade-to-dark overlay. */
  .land .pg1:not(.pg1--me) .hstage, .land.nosend .pg1:not(.pg1--me) .hstage { margin-top: -56px; min-height: calc(var(--tor) + 15rem + 56px); max-height: calc(var(--hD) + 69.4cqw + 112px); }
  .land .pg1:not(.pg1--me) .hstage::before { display: none; }

  .land .pg1:not(.pg1--me) .hstage .htoran { top: 0; height: var(--tor); -webkit-mask-image: linear-gradient(180deg, #000 0, #000 70%, transparent 100%); mask-image: linear-gradient(180deg, #000 0, #000 70%, transparent 100%); }
  /* transparent header: only a soft top scrim (#0B0F14 55% -> 0 over 72px) so the wordmark and the live pill keep 4.5:1 on the art; wordmark always shown */
  #f1 .tbar:not(.stuck)::before { inset: 0 0 auto; height: 72px; background: linear-gradient(180deg, rgb(11 15 20 / .55) 0, rgb(11 15 20 / 0) 100%); }
  #f1 .tbar.stuck::before { inset: 0; height: auto; background: rgb(11 15 20 / .94); }

  /* ===== r18 · D-091: landing first screen rework ===== */

  .land .pg1:not(.pg1--me) .hstage > video.hero-vid { position: absolute; left: 0; top: 0; bottom: auto; width: 100%; height: calc(100% - var(--hD) + 52.8cqw); max-width: none; aspect-ratio: auto; object-fit: cover; object-position: 50% 100%; -webkit-mask-image: none; mask-image: none; }

  .pr .privlink--tiny { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; margin: 0 auto; padding: 0 8px; font: 400 0.875rem/1.375rem var(--db-font-ui); color: rgb(255 247 237 / .7); text-decoration: underline; text-underline-offset: 3px; justify-self: center; }

  /* ===== r27 · D-101 ===== */
  /* landing: the counter block above the CTA (hero band flexes to whatever is left) */
  .land .pg1:not(.pg1--me) .hstage, .land.nosend .pg1:not(.pg1--me) .hstage { min-height: calc(var(--tor) + 11rem + 56px); }

  .reach__c[hidden], .rkc[hidden], .mezero[hidden], .reach[hidden] { display: none; }

  /* ===== r31 · D-105 (locked): header (+toran, ticker) > pill + title + sub on the page > hero video band (no text, feathered into #0B0F14) > counter > CTA ===== */
  .land .pg1:not(.pg1--me) > .htoran { position: absolute; z-index: 1; left: 0; right: 0; top: 0; width: auto; margin: 0; height: var(--tor); overflow: hidden; mix-blend-mode: screen; pointer-events: none; }

  .land .pg1:not(.pg1--me) .proof { grid-template-columns: minmax(0, 1fr); min-width: 0; width: 100%; }

  .land .pg1:not(.pg1--me) .proof__goal { white-space: nowrap; }

  .land .pg1:not(.pg1--me) .proof { margin-bottom: clamp(20px, 4vh, 36px) !important; }

  @media (max-height: 700px) { .land .pg1:not(.pg1--me) .proof { margin-bottom: 18px !important; } .pcar { margin-top: 8px; } }

  .pcar .pface, .land .pg1:not(.pg1--me) .proof .pcar .pface { width: 52px !important; height: 52px !important; }

  @media (max-height: 700px) { .pcar .pface, .land .pg1:not(.pg1--me) .proof .pcar .pface { width: 46px !important; height: 46px !important; } }
